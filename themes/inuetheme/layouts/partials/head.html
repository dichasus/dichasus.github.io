<head>
	<title>INUE-CSI - {{ .Title }}</title>

	<meta charset=utf-8>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="icon" type="image/png" sizes="194x194" href="/favicon-194x194.png" />
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />


	{{ $sass := resources.Get "inue.scss" }}
	{{ $style := $sass | resources.ToCSS }}

	<link rel="stylesheet" href="{{ $style.Permalink }}">

	{{ $bootstrap := resources.Get "bootstrap/js/bootstrap.min.js" }}

	<script src="{{ $bootstrap.Permalink }}"></script>

	{{ $highlight := resources.Get "highlight.min.js" }}

	<script src="{{ $highlight.Permalink }}"></script>

	{{ $vs2015 := resources.Get "vs2015.min.css" }}

	<link rel="stylesheet" href="{{ $vs2015.Permalink }}">

</head>
