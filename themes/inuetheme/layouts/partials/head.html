<head>
	<title>DICHASUS - {{ .Title }}</title>

	<meta charset=utf-8>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="icon" type="image/png" sizes="194x194" href="/favicon-194x194.png" />
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />


	{{ $sass := resources.Get "inue.scss" }}
	{{ $style := $sass | resources.ToCSS }}

	<link rel="stylesheet" href="{{ $style.Permalink }}">

	{{ $bootstrap := resources.Get "bootstrap/js/bootstrap.min.js" }}

	<script src="{{ $bootstrap.Permalink }}"></script>

	{{ $highlight := resources.Get "highlight.min.js" }}

	<script src="{{ $highlight.Permalink }}"></script>

	{{ $highlightTheme := resources.Get "stackoverflow-light.min.css" }}

	<link rel="stylesheet" href="{{ $highlightTheme.Permalink }}">

	<!-- OpenLayers map -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.8.1/css/ol.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.8.1/build/ol.js"></script>
</head>
