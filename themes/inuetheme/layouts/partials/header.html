<header class="d-flex bg-dark text-white flex-wrap justify-content-center p-3 mb-4">
	<div class="container">
		<div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
			<a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
				<img height="30" class="px-3" src="/img/dichasus-logo.svg">
				<span class="fs-4">{{.Site.Title}}</span>
			</a>

			<ul class="nav nav-pills px-4">
				{{ $currentPage := . }}
				{{ range .Site.Menus.main }}
				<li class="nav-item">
					<a href="{{ .Page.Permalink }}" title="{{ .Title }}" class="nav-link text-white fw-bold {{if (in $currentPage.Permalink .Page.Permalink) }} active{{end}}" aria-current="page">{{ .Name }}</a>
				</li>
				{{ end }}
				<li class="nav-item nav-item-espargos">
					<a href="https://espargos.net" title="ESPARGOS" class="nav-link text-white fw-bold" aria-current="page">
						<img width="110px" src="/img/espargos-logo.svg"></img>
					</a>
				</li>
			</ul>
		</div>
	</div>
</header>
