<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 44" role="img" aria-labelledby="title desc">
	<title id="title">DICHASUS distributed antenna arrays</title>
	<desc id="desc">Two wide antenna arrays facing each other with a centered sinusoidal signal between them.</desc>

	<g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
		<!-- The centered phase trace has equal clearance from both arrays. -->
		<path d="M40 22c3.33-8 6.67-8 10 0s6.67 8 10 0 6.67-8 10 0 6.67 8 10 0" stroke-width="3.2"/>
	</g>

	<!-- Frames and four-by-two patches share the same projective mapping. -->
	<g fill="#fff">
		<!-- This is a filled frame rather than a uniform stroke: the far edge
		     becomes thinner under perspective just like the antenna patches. -->
		<path id="left-array-frame" fill-rule="evenodd" d="M2 10 34 14v16L2 34z M5.02 11.89 32.58 14.89v14.22L5.02 32.11z"/>
		<use href="#left-array-frame" transform="translate(120) scale(-1 1)"/>

		<g id="left-array-elements">
			<path d="m5.69 14.62 6.98.55v5.34l-6.98-.13z"/>
			<path d="m5.69 23.62 6.98-.13v5.34l-6.98.55z"/>

			<path d="m14.70 15.34 5.72.45v4.85l-5.72-.1z"/>
			<path d="m14.70 23.46 5.72-.1v4.85l-5.72.45z"/>

			<path d="m22.11 15.93 4.78.38v4.45l-4.78-.09z"/>
			<path d="m22.11 23.33 4.78-.09v4.45l-4.78.38z"/>

			<path d="m28.31 16.42 4.05.33v4.1l-4.05-.07z"/>
			<path d="m28.31 23.22 4.05-.07v4.1l-4.05.33z"/>
		</g>
		<use href="#left-array-elements" transform="translate(120) scale(-1 1)"/>
	</g>
</svg>
